<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as a home-screen app (iOS: Share > Add to Home Screen); see sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kubus" />
    <!-- No apple-mobile-web-app-status-bar-style: black-translucent makes iOS 26.1+ draw a fade over
         the page's top (no opt-out). The home-screen app's status bar is then iOS's opaque white
         one; neither the page's colours nor theme-color tint it there. iOS reads this at install.
         theme-color is for other browsers: Carbon's layer-accent, like the tab strip. -->
    <meta name="theme-color" content="#e0e0e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#393939" media="(prefers-color-scheme: dark)" />
    <title>Kubus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
