<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as a home-screen app (iOS: Share > Add to Home Screen); see sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kubus" />
    <!-- Translucent: the page runs behind the status bar, so the tab strip's colour (Carbon's
         layer-accent) shows there. iOS 26.1+ blurs that area unless a fixed element with a solid
         colour spans the top edge: .status-bar-sampler (styles.css). iOS reads this at install. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#e0e0e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#393939" media="(prefers-color-scheme: dark)" />
    <title>Kubus</title>
  </head>
  <body>
    <div class="status-bar-sampler" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
