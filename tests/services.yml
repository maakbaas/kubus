name: kubus-test
# The databases and services the tests run against for real (tests/setup-env.sh starts them;
# CI starts the same images as job services). Ports and passwords match tests/env.sh.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    healthcheck: { test: pg_isready -U postgres, interval: 2s, retries: 30 }
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: mysql }
    ports: ["3306:3306"]
    healthcheck: { test: mysqladmin ping -h 127.0.0.1 -uroot -pmysql, interval: 2s, retries: 60 }
  mariadb:
    image: mariadb:11.4
    environment: { MARIADB_ROOT_PASSWORD: mariadb }
    ports: ["3307:3306"]
    healthcheck: { test: healthcheck.sh --connect --innodb_initialized, interval: 2s, retries: 60 }
# The connectors' real services (profile `connectors`: tests/setup-env.sh --connectors, or
# `docker compose -f tests/services.yml --profile connectors up -d --wait <service>`).
  influxdb:
    image: influxdb:2.7.12
    profiles: [connectors]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: kubus
      DOCKER_INFLUXDB_INIT_PASSWORD: kubus-test-password
      DOCKER_INFLUXDB_INIT_ORG: kubus
      DOCKER_INFLUXDB_INIT_BUCKET: setup
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kubus-test-admin-token
    ports: ["8086:8086"]
    healthcheck: { test: influx ping, interval: 2s, retries: 30 }
  n8n:
    image: n8nio/n8n:2.45.5
    profiles: [connectors]
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_LISTEN_ADDRESS: 0.0.0.0
    ports: ["5678:5678"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness || exit 1"], interval: 3s, retries: 40 }
  # Actual Budget is read through actual-http-api, which needs Actual's server (and a budget on it:
  # server/test/connectors/actualSeed.cjs makes an empty one when actual-api starts).
  actual:
    image: actualbudget/actual-server:26.10.0
    profiles: [connectors]
    environment:
      ACTUAL_HOSTNAME: 0.0.0.0
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5006/info').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""], interval: 3s, retries: 40 }
  actual-api:
    image: jhonderson/actual-http-api:26.10.1
    profiles: [connectors]
    depends_on:
      actual: { condition: service_healthy }
    environment:
      ACTUAL_SERVER_URL: http://actual:5006
      ACTUAL_SERVER_PASSWORD: kubus-test-password
      API_KEY: kubus-test-api-key
      ACTUAL_DATA_DIR: /data
    volumes:
      - ../server/test/connectors/actualSeed.cjs:/seed/actualSeed.cjs:ro
    entrypoint: ["sh", "-c", "node /seed/actualSeed.cjs && exec node server.js"]
    ports: ["5007:5007"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- --header 'x-api-key: kubus-test-api-key' http://127.0.0.1:5007/v1/budgets >/dev/null || exit 1"], interval: 3s, retries: 60 }
