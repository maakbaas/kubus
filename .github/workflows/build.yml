name: Build

# On every push: type check, tests and linting, then the Windows installers and the portable
# executable as downloadable artifacts of the run (Actions tab > the run > Artifacts).
# A tag `v1.2.3` also publishes them on the Releases page. Can be started by hand too.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes an unfinished build of it pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Carbon packages report usage to IBM on install unless this is set.
env:
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Rust toolchain is already on the runner. This caches the compiled dependencies,
      # which is most of the build time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: npm ci

      # A tag `v1.2.3` is the version, for this build only: written into the files that hold one
      # (installer name and Windows version come from tauri.conf.json). Nothing is committed.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" desktop/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$version\"/" desktop/tauri.conf.json
          sed -i "0,/\"version\": \".*\"/s//\"version\": \"$version\"/" package.json

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The Rust side compiles against the built frontend (tauri's frontendDist), so it comes first.
      - name: Build web
        run: npm run build:web

      - name: Rust format
        working-directory: desktop
        run: cargo fmt --check

      # Warnings are errors.
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: desktop
        run: cargo test

      # Same command as on a developer machine: NSIS (.exe) and MSI installers, plus the bare
      # release executable.
      - name: Build installers
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: kubus-installer-${{ github.sha }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # Portable: the single executable runs without installing (needs the WebView2 runtime,
      # which Windows 10/11 ships with). Its data lives in %LOCALAPPDATA%\com.kubus.app.
      - uses: actions/upload-artifact@v4
        with:
          name: kubus-portable-${{ github.sha }}
          path: desktop/target/release/kubus.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kubus-*-${{ github.sha }}
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
