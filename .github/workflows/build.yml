name: Build

# On every push: the app's unit tests and linting, then the Windows installers and the portable
# executable, the macOS disk image and the Linux packages as downloadable artifacts of the run
# (Actions tab > the run > Artifacts). A tag `v1.2.3` also publishes them on the Releases page.
# Can be started by hand too.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes an unfinished build of it pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Carbon packages report usage to IBM on install unless this is set.
env:
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Rust toolchain is already on the runner. This caches the compiled dependencies,
      # which is most of the build time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: npm ci

      # A tag `v1.2.3` is the version, for this build only: written into the files that hold one
      # (installer name and Windows version come from tauri.conf.json). Nothing is committed.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node .github/version-from-tag.mjs "${GITHUB_REF_NAME#v}"

      # The platform-dependent tests only (paths, line endings): the app's vitest projects run in node
      # and take half a minute. The type check (build:web runs tsc too) and the server's tests don't
      # depend on the platform and are in test.yml.
      - name: Test
        run: npm run suite -- unit

      # The Rust side compiles against the built frontend (tauri's frontendDist), so it comes first.
      - name: Build web
        run: npm run build:web

      - name: Rust format
        working-directory: desktop
        run: cargo fmt --check

      # Warnings are errors.
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: desktop
        run: cargo test

      # Same command as on a developer machine: NSIS (.exe) and MSI installers, plus the bare
      # release executable.
      - name: Build installers
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: kubus-installer-${{ github.sha }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # Portable: the single executable runs without installing (needs the WebView2 runtime,
      # which Windows 10/11 ships with). Its data lives in %LOCALAPPDATA%\com.kubus.app.
      - uses: actions/upload-artifact@v4
        with:
          name: kubus-portable-${{ github.sha }}
          path: desktop/target/release/kubus.exe
          if-no-files-found: error
          retention-days: 14

  # macOS (one universal disk image for Apple silicon and Intel) and Linux (.deb, .rpm, AppImage).
  # Only the bundles: the checks above don't depend on the platform and run on Windows, the
  # other tests on Linux in test.yml.
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            files: desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest supported Ubuntu: a binary needs at least the glibc and WebKitGTK it was
          # built against, so this one runs on the most distributions.
          - os: ubuntu-22.04
            name: linux
            args: ''
            files: |
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
              desktop/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri's Linux prerequisites (https://tauri.app/start/prerequisites/#linux).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      # A universal app holds both architectures.
      - name: Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: npm ci

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node .github/version-from-tag.mjs "${GITHUB_REF_NAME#v}"

      # Not notarized (that needs a paid Apple developer account): only ad-hoc signed
      # (tauri.conf.json bundle.macOS.signingIdentity "-"), so macOS asks once before opening it.
      - name: Build packages
        run: npm run build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: kubus-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kubus-*-${{ github.sha }}
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*

  # The server: the Docker image builds (web app included); its type check is in test.yml.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Docker image
        run: docker build -f server/Dockerfile .
