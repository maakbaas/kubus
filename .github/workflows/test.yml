name: Test

# The critical regression tests on every push, on Linux: four parallel jobs, each within 10 minutes
# (`tests/run.mjs` fails a suite over its budget), so a push is judged in about the longest of them:
# - typecheck: the app, the server and the server's tests;
# - unit: the vitest projects that need nothing (domain, storage, sync, api, app);
# - server: the nodesqlite, connectors and server vitest projects against Postgres, MySQL 8 and MariaDB;
# - gui-smoke: the GUI suite's smoke tests of the suites this branch's changes reach (gui-tests/areas.mjs),
#   all of them on main; not the screenshot baselines (machine-dependent).
# The slow part stays out of the way: full.yml has the connectors' real services (n8n alone takes 1 to 2
# minutes to start), the whole GUI suite sharded over jobs, and coverage. build.yml (Windows) runs `unit` there.
# tests/README.md is the catalog of the suites.
on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the server's Node (it runs its TypeScript directly)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run suite -- typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run suite -- unit

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # The MySQL / MariaDB connector's (server/test/mysql.ts).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # server/test/postgres.ts and mysql.ts; in CI a missing database fails the tests instead of skipping them.
      KUBUS_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres
      KUBUS_TEST_MYSQL: mysql://root:mysql@127.0.0.1:3306
      KUBUS_TEST_MARIADB: mysql://root:mariadb@127.0.0.1:3307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      # /api/v1 answers from it: the server's HTTP tests use it.
      - run: npm run build:headless
      - run: npm run suite -- nodesqlite connectors server

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --changed compares with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's Chrome is the browser.
      - run: npm install -g @playwright/cli@0.1.22
      # The GUI build (gui-tests/.build) is not cached: the runner remakes it when a source file is newer, and a
      # checkout stamps every file with the present time, so a restored cache would be rebuilt anyway (~30 s).
      - name: GUI smoke tests
        run: npm run suite -- gui-smoke
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-report
          path: gui-tests/report/
          retention-days: 14
