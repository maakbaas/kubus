# The Kubus server: sync API and web app on one port. Postgres is external and already running:
# fill in the two placeholders below, then `docker compose up --build`.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Your existing Postgres. host.docker.internal reaches one on the Docker host.
      DATABASE_URL: postgres://USER:PASSWORD@host.docker.internal:5432/DATABASE
      # Shared secret of all your devices; enter it with the server URL on the app's Sync page.
      # Any long random string, e.g. node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
      KUBUS_TOKEN: change-me
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
