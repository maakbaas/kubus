# The Kubus server (sync, the HTTP API at /api/v1 and the web app on one port) with its own Postgres. The server image is
# built by GitHub Actions (.github/workflows/image.yml). Change the two passwords/tokens below,
# then `docker compose up -d`. Update with `docker compose pull && docker compose up -d`.
# To use a Postgres you already run instead, delete the `db` service and `depends_on`, and point
# DATABASE_URL at it (host.docker.internal reaches one on the Docker host).
services:
  db:
    container_name: kubus-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kubus
      POSTGRES_PASSWORD: change-me-too
      POSTGRES_DB: kubus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubus -d kubus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    container_name: kubus
    image: ghcr.io/maakbaas/kubus:latest
    pull_policy: always
    environment:
      DATABASE_URL: postgres://kubus:change-me-too@db:5432/kubus
      # Shared secret of all your devices; enter it with the server URL in the app's Settings → Sync.
      # Any long random string, e.g. node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
      KUBUS_TOKEN: change-me
      # Optional: encrypts the secrets set in Settings → Server (the model's key, the sources'
      # passwords) in the database; without it they are stored as plain text. Another long random
      # string, not the token; keep it: if it is lost or changed, those secrets must be entered again.
      # KUBUS_SECRET_KEY: another-long-random-string
      # Optional: a URL (or several, comma-separated) called with every change, signed with the
      # secret (X-Kubus-Signature; see Help → API in the app).
      # KUBUS_WEBHOOK_URL: https://automation.example.com/hooks/kubus
      # KUBUS_WEBHOOK_SECRET: another-long-random-string
      # The API's own copy of your data (the headless device) is kept in this directory, so a restart
      # resumes where it was instead of downloading everything and answering 503 meanwhile. It is
      # only a cache of the database above (nothing is lost if it is deleted), and only one server
      # may use it. Remove this line and the mount below to keep it in memory.
      KUBUS_HEADLESS_DIR: /data/headless
    volumes:
      - headless:/data/headless
      # or a folder next to this file instead of a named volume:
      # - ./kubus-headless:/data/headless
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  headless:
